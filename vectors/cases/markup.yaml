- id: orphan-li-after-heading
  source: antagor tests/test_markup_check.py::test_orphan_li_after_heading (ost 357)
  format: html
  text: <h2>Сроки</h2><li>с 1 июля 2026 года - сканирование на кассах;</li><p>Текст</p>
  rules:
  - markup
  expect:
    gate_failed: true
    humanizer:
      score: 0
      verdict: clean
    issues:
    - rule: markup
      message: Пункт списка вне списка <ul>/<ol> - вставлен не на место
      excerpt: с 1 июля 2026 года - сканирование на кассах;
      gate: true
      unit: paragraph
      address:
        block: 1
        anchor: afe891cf
        quote: с 1 июля 2026 года - сканирование на кассах;
      action: rewrite_block
