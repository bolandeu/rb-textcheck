      message: 'Разделов <h2>: 2, минимум 3'
      excerpt: ''
      gate: true
      unit: article
      address: null
      action: manual
    - rule: headings
      message: Двоеточие в заголовке
      excerpt: 'Ставка: из чего складывается'
      gate: true
      unit: phrase
      address:
        block: 1
        anchor: c7a0a63e
        quote: 'Ставка: из чего складывается'
      action: rewrite_block
    - rule: headings
      message: Штамп в заголовке «простыми словами»
      excerpt: Фрахт простыми словами
      gate: true
      unit: phrase
      address:
        block: 2
        anchor: 2a3cd344
        quote: Фрахт простыми словами
      action: rewrite_block
