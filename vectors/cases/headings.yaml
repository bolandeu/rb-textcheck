  format: html
  profile: profiles/content-write.quality.yml
  text: '<h2>Как рассчитывают фрахт</h2><h3>Ставка: из чего складывается</h3><h3>Фрахт простыми словами</h3><h2>Кто платит за перевозку</h2>'
  rules:
  - headings
  expect:
    gate_failed: true
    humanizer:
      score: 0
      verdict: clean
    issues:
