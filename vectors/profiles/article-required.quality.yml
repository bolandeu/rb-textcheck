# Наследование: берёт vat-22 (forbid объединяются - базовые первыми) и
# добавляет обязательные разделы h2 и свой запрет.
extends: vat-22
headings:
  h2_min: 2
  required:
    - Частые вопросы              # строка: заголовок целиком, без учёта регистра, ё/е, пробелов и точки в конце
    - name: Как выбрать            # паттерн: regex по тексту h2, без учёта регистра
      regex: '^как выбрать'
forbid:
  - name: бетон
    regex: 'бетон\w*'
