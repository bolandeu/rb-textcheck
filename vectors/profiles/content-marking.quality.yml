# Профиль качества промта prompts/content-marking.md.
#
# Информационная статья серии «маркировка Честный ЗНАК + товар» для сайта.
# Статья открывает тему маркировки конкретного товара и последним разделом
# ведёт на страницу услуги маркировки на СВХ / таможенном складе.
#
# Отсюда отличия от базового профиля:
# - структура фиксированная и длинная (12 информационных разделов + FAQ +
#   «где заказать»), поэтому и h2, и объём выше базовых;
# - на сайте нужны h3 - разделы с подпунктами (сроки, остатки, импорт,
#   маркетплейсы) без них превращаются в сплошной текст;
# - главный риск темы - выдуманные даты, штрафы и цены: регуляторика
#   меняется, и модель охотно дописывает «с 1 сентября» по памяти.

length:
  min_chars: 8000
  max_chars: 16000
  tolerance: 0.15

headings:
  h2_min: 9
  h2_max: 14
  forbid_colon: true

tags:
  forbidden: [h1, h4, h5, h6, script, style, iframe]

cliches:
  - лидер рынка
  - индивидуальный подход
  - лучшие специалисты
  - команда профессионалов
  - широкий спектр услуг
  - на рынке уже более

forbid:
  - name: клише «под ключ»
    regex: '(?<!размер )(?<!размером )под ключ(?! на \s?\d)'
    judge: "не обещать «под ключ» - сказать, что конкретно входит в работу"

  - name: негативный параллелизм
    regex: 'не (?:просто|только)\b[^.!?\n]{0,60}?(?:,\s*а\s|\bно и\b)'
    judge: "не использовать конструкции «не просто X, а Y» и «не только X, но и Y»"

  - name: призыв к действию в лоб
    regex: '(?:оставьте заявку|свяжитесь с нами|позвоните нам|звоните)'
    judge: "не звать к действию в лоб - раздел «где заказать» подводит к услуге через её содержание и ссылку"

  - name: служебная пометка источника
    regex: '\[(?:ПОДТВЕРЖДЕНО|УНИКАЛЬНО|НЕПОДТВЕРЖДЕНО|ТОВАР)\]|\(\d+\s+источник|\[источник'
    judge: "в тексте не должно остаться служебных пометок и незаменённого [ТОВАР]"

humanizer:
  enabled: true
  error_is_gate: true
  max_warnings: 25
  mute:
    - негативный параллелизм

grounding:
  # Даты, штрафы и цены обязаны браться из контекста - это главный риск темы.
  # Пока отчёт без гейта: порог включать только после замера на стенде.
  report_only: true

generation:
  constraints: |
    ## ТРЕБОВАНИЯ К ТЕКСТУ

    Это тот же профиль качества, по которому статья потом проверяется
    автоматически - нарушение любого пункта вернёт её на доработку.

    Объём и структура:
    - 8000-16000 символов чистого текста без учёта разметки;
    - 9-14 разделов <h2>, подразделы - <h3>; <h1> и <h4>-<h6> нет;
    - в заголовках нет двоеточий: заголовок прямо называет содержание раздела.

    Язык:
    - не используй длинное тире «—» и среднее «–» ни как знак препинания, ни
      как разделитель диапазонов: только короткий дефис «-», запятая, скобки
      или отдельное предложение. Тире в тексте этого промта - разметка
      инструкции, а не образец для статьи;
    - не ставь знак вместо слова в прозе: «маркировка + ЭДО», «цена >
      штрафа» - связки пиши словами;
    - без канцелярита и штампов: «лидер рынка», «индивидуальный подход»,
      «команда профессионалов», «широкий спектр услуг», «под ключ»;
    - без конструкций «не просто X, а Y» и «не только X, но и Y», без
      рубленых серий «Без X. Без Y.»;
    - без формального открытия («В современном мире...», «Сегодня
      маркировка...»), без эмодзи, без каскада смягчений («как правило,
      обычно, в большинстве случаев» в одной фразе);
    - ритм живой: длинные предложения чередуются с короткими, один глагол
      не повторяется в соседних фразах, жирным выделяй только подпункты FAQ.

    Чего не должно быть:
    - дат, этапов, номеров постановлений, статей КоАП, сумм штрафов, цен и
      кодов ТН ВЭД, которых нет в разделе «Контекст»;
    - призывов к действию в лоб («оставьте заявку», «свяжитесь с нами»);
    - служебных пометок и разговора про контекст и источники.
