# Профиль качества промта prompts/content-import-article.md.
#
# Информационная статья про импорт товара из Китая для Дзена. От сайтовой
# статьи (content-logistics) отличается площадкой, а не предметом: контекст
# тот же, запреты на цифры те же, но текст короче, разговорнее и живёт по
# правилам ленты, а не поисковой выдачи.
#
# Что диктует площадка:
# - заголовок публикации Дзен задаёт отдельным полем, поэтому <h1> в теле
#   статьи не нужен - он продублирует заголовок карточки;
# - лента наказывает за рекламный тон сильнее поиска: коммерческий блок
#   остаётся (решение пользователя), но обещания и превосходные степени
#   запрещены жёстче;
# - материал читают с телефона в потоке, поэтому 2000-4000 знаков и короткие
#   абзацы, а не 6000 как на сайте.
#
# Правило то же, что и у остальных профилей: всё предметное - здесь, в коде
# только проверки вида «текст целый и не машинный».

length:
  # По тексту без разметки. Верх ниже сайтового: лонгрид в ленте дочитывают
  # хуже, а нижняя граница держит статью информационной, а не заметкой.
  min_chars: 2000
  max_chars: 4000
  tolerance: 0.15
  gate: false

headings:
  h2_min: 4
  h2_max: 8
  # Двоеточие в заголовке - маркер машинного текста: заголовок должен прямо
  # описывать то, что под ним, без конструкции «тема: пояснение».
  forbid_colon: true

tags:
  # h1 запрещён по площадке, а не по вкусу: заголовок статьи Дзен берёт из
  # отдельного поля, и h1 в теле удваивает его.
  #
  # Таблицы Дзен в разметке не принимает, поэтому запрещён не только <table>,
  # но и его части: модель иногда отдаёт <tr>/<td> без обёртки, и такой
  # обломок проходит мимо запрета на сам <table>.
  forbidden: [h1, h3, h4, h5, h6, script, style, iframe, table, thead, tbody, tr, td, th]

cliches:
  - лидер рынка
  - лидеры рынка
  - индивидуальный подход
  - лучшие специалисты
  - команда профессионалов
  - гарантируем полное соответствие
  - широкий спектр услуг
  - на рынке уже более

forbid:
  - name: клише «под ключ»
    # Тот же вид исключения, что и в профиле логистики: сравнение по подстроке
    # ловило «размер под ключ 1-2 мм» - нормальный термин ниши.
    regex: '(?<!размер )(?<!размером )под ключ(?! на \s?\d)'
    judge: "не обещать «под ключ» - это пустая формулировка; вместо неё сказать, что конкретно входит в работу"

  - name: негативный параллелизм
    regex: 'не (?:просто|только)\b[^.!?\n]{0,60}?(?:,\s*а\s|\bно и\b)'
    judge: "не использовать конструкции «не просто X, а Y» и «не только X, но и Y»"

  - name: ставки пошлин и НДС
    # Промт это уже запрещает словами, но словесный запрет модель нарушает:
    # на корпусе mw служебные фразы пришлось запрещать тремя слоями, прежде
    # чем они исчезли. Здесь третий слой - проверка.
    regex: '(?:пошлин\w*|НДС)[^.!?\n]{0,30}\d+\s*%|\d+\s*%[^.!?\n]{0,30}(?:пошлин|НДС)|ТН\s?ВЭД\s*\d|код\s+\d{4}'
    judge: "не называть ставки пошлин, НДС и коды ТН ВЭД - они меняются и зависят от товара"

  - name: расчёт таможенных платежей
    regex: '\d+\s*(?:руб|USD|EUR|\$|€)[^.!?\n]{0,40}(?:пошлин|платеж|НДС|сбор)'
    judge: "не считать таможенные платежи в деньгах - сумма зависит от кода, стоимости и действующих ставок"

  - name: обещание сроков нашей доставки
    regex: '(?:доставим|довезём|привезём|отгрузим)[^.!?\n]{0,40}\d+\s*(?:дн|недел|сут)'
    judge: "не обещать сроки доставки от лица компании; типичные для рынка ориентиры приводить можно"

  - name: призыв к действию в лоб
    # Лента режет прямую продажу. Подводка к услуге допустима, «оставьте
    # заявку» и «пишите в директ» - нет.
    regex: '(?:оставьте заявку|свяжитесь с нами|позвоните нам|пишите в директ|жми|подпишись)'
    judge: "не звать к действию в лоб - это рекламная вставка, площадка её наказывает"

  - name: служебная пометка источника
    regex: '\[(?:ПОДТВЕРЖДЕНО|УНИКАЛЬНО|НЕПОДТВЕРЖДЕНО)\]|\(\d+\s+источник|\[источник'
    judge: "в тексте не должно остаться служебных пометок исследования"

humanizer:
  enabled: true
  error_is_gate: true
  # Порог мягче сайтового: разговорная статья допускает больше вольностей,
  # чем коммерческая страница.
  max_warnings: 20
  mute:
    # Дубли правил, заведённых выше в forbid: без глушения одно нарушение
    # попадало бы в отчёт двумя строками.
    - мат-знаки
    - негативный параллелизм

grounding:
  report_only: true

judge_model: openrouter/openai/gpt-6-luna

generation:
  # Подставляется в промт вместо {{constraints}}. Это те же требования, по
  # которым статья потом проверяется: написание и проверка обязаны читать один
  # источник, иначе они расходятся.
  constraints: |
    ## ТРЕБОВАНИЯ К ТЕКСТУ

    Это тот же профиль качества, по которому статья потом проверяется
    автоматически - нарушение любого пункта вернёт её на доработку.

    Объём и структура:
    - 2000-4000 символов чистого текста без учёта разметки;
    - 4-8 разделов <h2>. Тега <h1> быть не должно: заголовок публикации
      площадка задаёт отдельным полем, и <h1> в теле его удвоит;
    - заголовков ниже <h2> нет, подпункт оформляется жирным началом абзаца;
    - таблиц нет, перечисления - списками <ul>/<ol>;
    - абзац - три-четыре предложения: материал читают с телефона в ленте.

    Язык:
    - не используй длинное тире «—» и среднее «–» ни как знак препинания, ни
      как разделитель диапазонов: только короткий дефис «-», запятая, скобки
      или отдельное предложение;
    - не ставь знак вместо слова в прозе: «доставка + таможня», «цена >
      качества» - союзы и связки пиши словами. В записи характеристик знак
      уместен: «±0,5°C», «UPF 50+»;
    - без канцелярита и рекламных штампов: «лидер рынка», «индивидуальный
      подход», «команда профессионалов», «широкий спектр услуг»;
    - без конструкций «не просто X, а Y» и «не только X, но и Y».

    Чего не должно быть:
    - ставок пошлин, НДС, кодов ТН ВЭД и расчётов платежей в деньгах;
    - обещаний сроков доставки от лица компании;
    - призывов к действию в лоб («оставьте заявку», «свяжитесь с нами»):
      о работе компании рассказывай через то, что именно делается на этапе,
      а не через предложение обратиться;
    - служебных пометок исследования и разговора про контекст и источники:
      читатель про них не знает.

    Опора на факты:
    - всё, что есть в разделе «Контекст», используй именно оттуда, а не по
      общим соображениям;
    - чего в контексте нет - не утверждай как факт. Лучше написать, что
      требование зависит от категории товара, чем назвать несуществующее.
