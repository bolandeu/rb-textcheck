# Запрет «ставка НДС 20%» - был зашит в antagor PIPELINE_FORBID (решение
# пользователя 2026-09-28: ставка НДС 22%, ost 356). В textcheck 0.2.0 вынесен
# из кода в профиль: правило предметное, а не общее для любой ниши.
forbid:
  - name: ставка НДС 20%
    regex: 'НДС[^.!?\n]{0,20}?\b20\s*(?:%|процент)|\b20\s*(?:%|процент\w*)[^.!?\n]{0,5}(?:НДС|налог\w* на добавленн)'
    judge: "ставка НДС - 22%, упоминать ставку 20% нельзя: цены с НДС пересчитываются по 22% (код маркировки 50 копеек без НДС - 61 копейка с НДС)"
