# Образец kind: meta - antagor prompts/seo-meta.quality.yml (9a5e4d8) + строка kind.
kind: meta
# Профиль правил команды seo-meta (prompts/seo-meta.md).
#
# Числа - стартовые, из требований поисковиков (docs/runners/seo-meta.md,
# раздел «Требования поисковиков», 2026-09-29): официальных лимитов длины
# ни у Яндекса, ни у Google нет, обрезка по ширине экрана. Окончательные
# ставит замер стенда bench/seo-meta.yml.
#
# Проект может переопределить профиль своим файлом рядом с промтом
# (-profile), правила в промт подставляются отсюда, а не вшиты в него.

length:
  seo.title: [40, 65]
  seo.h1: [20, 70]
  seo.description: [120, 160]

# Клише: находит regex, решает типизированная модель (второй контур) -
# «болты различаются размером под ключ на 1-2 мм» не клише.
cliches:
  - под ключ
  - лучшие цены
  - лучший
  - №1
  - высокое качество
  - индивидуальный подход
  - широкий спектр
  - профессионалы своего дела
  - быстро и недорого

# Слова коммерческого запроса: в title/description информационной записи им
# не место, у коммерческой - нормальны.
commercial_words:
  - купить
  - цена
  - цены
  - стоимость
  - заказать
  - недорого
  - прайс

# Шаблонные хвосты, против которых прямо пишет Яндекс
template_tails:
  - описание, цены
  - цены, характеристики
  - фото, отзывы
  - характеристики, фото

# Заголовки (title, H1) - как у русского редактора, не калька с английского
# SEO (решение пользователя 2026-09-30). Двоеточие и штампы ловит код без
# jev: в заголовке они однозначны. Описание (description) не касается.
heading_fields: [seo.title, seo.h1]
# штампы - общий список utils/quality_checks.HEADING_STAMPS, правила в промт -
# prompts/rules/language.md (общие с content-write/content-rewrite)

# Правила поля сверх общего блока языка - в промт как {{field_rules}}.
# Длину title (минимум length.seo.title) добирать пользой материала, а не
# хвостами ради размера (решение пользователя 2026-09-30).
field_rules:
  seo.title: |
    - Если title короче нужной длины, дополни его пользой материала: какое действие читатель сможет сделать или какой вопрос решит (как рассчитать, как избежать штрафа, кто платит, что проверить).
    - Не добавляй слова ради длины: хвосты вроде «и его особенности», «для бизнеса», «и декларирование», «для разных объёмов» - это текст ради текста.
      Так не надо -> так хорошо:
      FCL и LCL в грузоперевозках для разных объёмов -> FCL или LCL и как выбрать под объём груза
      Таможенный контроль после выпуска товаров и его особенности -> Таможенный контроль после выпуска и как подготовиться к проверке
  # description развёрнутее title: его задача - переход из сниппета
  # (решение пользователя 2026-09-30)
  seo.description: |
    - Цель description - чтобы человек перешёл из сниппета. Разверни то, что в title сказано коротко: какие вопросы материал закрывает и что читатель сможет сделать после прочтения (рассчитать, выбрать, оформить, проверить, избежать ошибки).
    - Конкретика вместо общих слов: назови 2-3 вещи, которые человек найдёт на странице. Не «рассказываем всё о фрахте», а «виды фрахта, из чего складывается ставка и кто её платит».
    - Не пересказывай title другими словами и не добивай длину общими фразами.
    - Только то, что есть на странице: без цен, сроков и гарантий, которых нет в данных о ней.
