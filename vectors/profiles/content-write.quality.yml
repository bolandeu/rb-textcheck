# Базовый профиль качества промта prompts/content-write.md.
#
# Предметных запретов здесь нет намеренно: content-write.md - промт общего
# назначения, под любую нишу. Всё, что специфично для проекта или тематики,
# живёт в профиле своего промта (образец - content-logistics.quality.yml).
#
# Здесь только то, что верно для любой статьи пайплайна.

length:
  min_chars: 3000
  max_chars: 8000
  tolerance: 0.1

headings:
  h2_min: 3
  h2_max: 9
  forbid_colon: true

tags:
  forbidden: [h1, script, style, iframe]

forbid:
  - name: негативный параллелизм
    regex: 'не (?:просто|только)\b[^.!?\n]{0,60}?(?:,\s*а\s|\bно и\b)'
    judge: "не использовать конструкции «не просто X, а Y» и «не только X, но и Y»"

humanizer:
  enabled: true
  error_is_gate: true
  max_warnings: 20
  mute:
    - формальное открытие

grounding:
  report_only: true

generation:
  constraints: |
    Требования к тексту (тот же профиль, по которому статья потом проверяется):
    - 3-9 разделов <h2>; заголовок прямо описывает содержание раздела,
      без двоеточия и конструкции «тема: пояснение»;
    - без <h1>: название статьи выводит шаблон сайта;
    - без длинного тире «—» и среднего «–» нигде: ни как знак препинания, ни
      как разделитель диапазонов - только короткий дефис, запятая или скобки;
    - без знака вместо слова в прозе: «тюль + портьеры», «скорость > качества»,
      «заказ → таможня» - союзы и связки пиши словами. Знак в записи
      характеристики или измерения - норма и его не нужно избегать:
      «±0,5°C», «UPF 50+», «1 кВт = 1,36 л.с.», «стоимость > 450 000 руб.»;
    - без конструкций «не просто X, а Y», «не только X, но и Y»;
    - все факты и цифры - только из переданного контекста, без домысливания.
