# Профиль качества промта prompts/content-logistics.md.
#
# Сюда перенесены требования, до 2026-09-23 зашитые в Python
# (commands/content_quality.py) и продублированные словами в самом промте
# генерации. Смысл не менялся: статьи логистики проверяются как раньше.
#
# Правило: всё предметное - здесь. В коде остаются только проверки вида
# «текст целый и не машинный», верные для любого проекта.

length:
  # По тексту без разметки, а не по HTML: до 2026-09-23 длина мерилась вместе
  # с тегами, из-за чего 78 статей из 104 ложно вылетали за верхнюю границу.
  #
  # gate: false - длина не валит статью, а идёт замечанием к сведению. Диапазон
  # здесь ориентир для генерации: модели стабильно пишут длиннее (медиана 7320
  # при потолке 6600 на замере по 104 статьям), и разворачивать их из-за этого
  # незачем - лишняя длина сама по себе не портит текст.
  min_chars: 3000
  max_chars: 6000
  tolerance: 0.1
  gate: false

headings:
  # Четыре раздела - нормальная статья, если каждый по делу (решение
  # пользователя 2026-09-23): порог 5 браковал законченные тексты вроде 3502,
  # где четыре полноценных раздела и 6.7 тысячи символов.
  h2_min: 4
  h2_max: 7
  # Двоеточие в заголовке - частый маркер нейросетевого текста: заголовок
  # должен прямо описывать то, что под ним, без конструкции «тема: пояснение».
  forbid_colon: true

tags:
  forbidden: [h1, script, style, iframe]

cliches:
  - лидер рынка
  - лидеры рынка
  - индивидуальный подход
  - лучшие специалисты
  - гарантируем полное соответствие
  - 100% пройдём
  - точно определим все риски

forbid:
  - name: клише «под ключ»
    # Не в списке cliches, а отдельным правилом: там сравнение по подстроке, и
    # оно ловило «болты различаются размером под ключ на 1-2 мм» - размер под
    # гаечный ключ, нормальный термин ниши (статья 3433, 2026-09-24). Запрет
    # адресован обещанию «доставка под ключ»: оно ничего не сообщает об услуге
    # и есть у каждого второго конкурента.
    regex: '(?<!размер )(?<!размером )под ключ(?! на \s?\d)'
    judge: "не обещать «под ключ» - это пустая формулировка; вместо неё сказать, что конкретно входит в работу"

  - name: негативный параллелизм
    regex: 'не (?:просто|только)\b[^.!?\n]{0,60}?(?:,\s*а\s|\bно и\b)'
    judge: "не использовать конструкции «не просто X, а Y» и «не только X, но и Y»"

  - name: сроки доставки
    # Запрещено только НАШЕ обязательство по доставке: на странице для этого
    # есть калькулятор, и текст не должен обещать другое. Сроки производства,
    # изготовления образца и типичные для ниши ориентиры - это информация о
    # рынке, а не оферта, и они разрешены (решение пользователя 2026-09-23).
    #
    # Раньше правило ловило любой диапазон в днях и давало 19 срабатываний из
    # 29 на прогоне 2026-09-23, почти все на сроках производства - то есть
    # правка вычищала полезное.
    regex: '(?:доставк\w*|перевозк\w*|отгруз\w*|транзит\w*|в пути|довез\w*|доставим)[^.!?\n]{0,60}\d+\s*[-–]\s*\d+\s*(?:дн|недел|сут)|\d+\s*[-–]\s*\d+\s*(?:дн|недел|сут)[^.!?\n]{0,40}(?:доставк\w*|перевозк\w*|в пути|транзит\w*)'
    judge: "не обещать сроки доставки нашей компанией - на странице для этого есть калькулятор; сроки производства и типичные для рынка ориентиры приводить можно"

  - name: цена перевозки
    regex: '\d+\s*(?:руб|USD|EUR|\$|€)[^.!?\n]{0,20}(?:за\s+)?(?:контейнер|кг|куб|доставк|перевозк)'
    judge: "не называть стоимость доставки и тарифы - они считаются под партию"

  - name: ставки пошлин
    # Слово «пошлина» само по себе - нормальная лексика ниши (ловило 20 статей
    # из 104 впустую), запрещены именно числовые ставки и коды ТН ВЭД.
    regex: '(?:пошлин\w*|НДС)[^.!?\n]{0,30}\d+\s*%|\d+\s*%[^.!?\n]{0,30}(?:пошлин|НДС)|ТН\s?ВЭД\s*\d|код\s+\d{4}'
    judge: "не называть конкретные ставки пошлин, НДС и коды ТН ВЭД - они меняются и зависят от товара"

  - name: знак вместо союза
    # Только знак между словами в прозе. Допуски (±3%), имена собственные
    # (Arts & Crafts) и запись "300+" сюда намеренно не попадают: первое -
    # точность, второе - название, третье - нормальная запись числа.
    regex: '[а-яёa-z]\s+[+=]\s+[а-яёa-z]'
    judge: "не заменять союзы и слова математическими знаками в прозе"

  - name: служебная пометка источника
    regex: '\[(?:ПОДТВЕРЖДЕНО|УНИКАЛЬНО|НЕПОДТВЕРЖДЕНО)\]|\(\d+\s+источник|\[источник'
    judge: "в тексте не должно остаться служебных пометок исследования"

humanizer:
  enabled: true
  error_is_gate: true
  max_warnings: 15
  mute:
    # Правило заточено под живой блог: в коммерческой статье формальное
    # открытие - норма жанра (83 срабатывания из 104 в замере 2026-09-23).
    - формальное открытие
    # Дубль: с 2026-09-24 правило линтера сужено до знака вместо слова (см.
    # utils/humanizer_lint.py) и совпадает с заведённым ниже forbid-правилом
    # "знак вместо союза" один в один - на корпусе mw обе формулировки дали
    # одни и те же 5 срабатываний. Без глушения нарушение попадало бы в отчёт
    # двумя строками. Математическую запись данных (±3%, UPF 50+, Arts &
    # Crafts) правило больше не трогает, глушить её ради этого не нужно.
    - мат-знаки
    # Дубль: этот же запрет заведён ниже в forbid как правило профиля, и без
    # глушения одно нарушение попадало в отчёт двумя строками.
    - негативный параллелизм

grounding:
  report_only: true

judge_model: openrouter/openai/gpt-6-luna

generation:
  # Этот блок подставляется в промт генерации вместо {{constraints}} - те же
  # требования, по которым статья потом проверяется. Формулировки перенесены
  # из prompts/content-logistics.md 2026-09-23, смысл не менялся.
  constraints: |
    ## ТРЕБОВАНИЯ К ТЕКСТУ

    Это тот же профиль качества, по которому статья потом проверяется
    автоматически - нарушение любого пункта вернёт её на доработку.

    Объём и структура:
    - 3000-6000 символов чистого текста без учёта разметки (больше данных в
      контексте - длиннее текст);
    - 4-7 разделов <h2>, без <h1>: заголовок страницы уже есть в шаблоне сайта;
    - заголовок раздела прямо описывает его содержание. Без двоеточия и
      конструкции «тема: пояснение» - это маркер машинного текста.

    Язык:
    - не используй длинное тире «—» и среднее «–» ни как знак препинания, ни
      как разделитель диапазонов: только короткий дефис «-», запятая, скобки
      или отдельное предложение;
    - не ставь знак вместо слова в прозе: «тюль + портьеры», «скорость >
      качества», «заказ → таможня» - союзы и связки пиши словами. В записи
      характеристик и измерений знак уместен, и обходить его словами не нужно:
      «±0,5°C», «допуск ±3%», «UPF 50+», «коэффициент 1 кВт = 1,36 л.с.»;
    - не используй конструкции «не просто X, а Y», «не только X, но и Y» и их
      вариации: это шаблонный AI-паттерн, пиши прямо одним утверждением;
    - избегай клише: «лидеры рынка», «индивидуальный подход», «лучшие
      специалисты», «под ключ», «гарантируем полное соответствие».

    Предметные запреты:
    - не обещай сроки и стоимость доставки от нашей компании (конкретные дни
      в пути, $/кг, цены за контейнер): на странице для этого есть отдельный
      блок - калькулятор и тарифы, дублировать в тексте не нужно. Про способы
      доставки (авиа, море, жд, авто) писать можно. Сроки производства,
      изготовления образца и типичные для рынка ориентиры - это информация о
      нише, а не оферта: их приводить можно, если они есть в контексте;
    - не указывай таможенные ставки, пошлины, НДС, сборы, расчёты платежей и
      коды ТН ВЭД: это общая статья про импорт товара, а не про растаможку,
      тема ставок раскрывается отдельной статьёй. Про сам факт необходимости
      таможенного оформления упомянуть можно, без цифр и ставок.

    Факты:
    - все цифры, названия и нормы - только из переданного контекста;
    - не заменяй конкретику из контекста абстрактными формулировками;
    - не пиши общих фраз там, где в контексте есть конкретные данные.
