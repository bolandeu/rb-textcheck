# Корпус-контракт textcheck fix (T78 A). Формат - vectors/README.md.
# addresses: каждый ожидаемый адрес - подмножество фактического (block для html, line для md).
- id: x1-thirty-dashes
  source: T78 X1 - 30 длинных тире -> 0, адреса блоков, разметка и порядок блоков не меняются (атрибут title не трогается)
  format: html
  profile: profiles/fix-typography.quality.yml
  text: |
    <h2>Один — два — три — четыре — пять — шесть</h2>
    <p>Раз — два — три — четыре — пять — шесть.</p>
    <ul><li>а — б — в — г — д — е</li><li>ж — з — и — к — л — м</li></ul>
    <p class="x" title="a — b">Текст — с — атрибутом — и — тире — тут.</p>
    <table><tr><td>я — ю — э — ь — ы — ъ</td></tr></table>
  expect:
    text: |
      <h2>Один - два - три - четыре - пять - шесть</h2>
      <p>Раз - два - три - четыре - пять - шесть.</p>
      <ul><li>а - б - в - г - д - е</li><li>ж - з - и - к - л - м</li></ul>
      <p class="x" title="a — b">Текст - с - атрибутом - и - тире - тут.</p>
      <table><tr><td>я - ю - э - ь - ы - ъ</td></tr></table>
    unchanged: false
    applied:
    - name: длинное тире
      count: 30
      addresses:
      - block: 0
      - block: 1
      - block: 2
      - block: 3
      - block: 4
      - block: 5
